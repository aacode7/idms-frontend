[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:api]
directory=/srv/idms-backend
command=/opt/venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000
autorestart=true
startretries=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:frontend]
directory=/srv/idms-frontend
command=/usr/local/bin/node /srv/idms-frontend/node_modules/next/dist/bin/next start -H 0.0.0.0 -p 9000
autorestart=true
startretries=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
