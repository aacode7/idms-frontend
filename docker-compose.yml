name: idms-frontend

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_IDMS_API_URL: ${NEXT_PUBLIC_IDMS_API_URL:-/api/v1}
        IDMS_API_INTERNAL_URL: ${IDMS_API_INTERNAL_URL:-http://api:8000}
    env_file:
      - .env.local
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    networks: [idms]

networks:
  idms:
    external: true
    name: idms_idms
