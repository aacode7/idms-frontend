name: idms-frontend

services:
  gateway:
    image: nginx:stable-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "0.0.0.0:9000:9000"
    depends_on:
      - web
    restart: unless-stopped
    networks: [idms]

  web:
    build:
      context: ..
      dockerfile: idms-frontend/Dockerfile.web
      network: host
      args:
        NEXT_PUBLIC_IDMS_API_URL: ${NEXT_PUBLIC_IDMS_API_URL:-/api/v1}
    env_file:
      - ../idms-backend/.env
      - .env.local
      - ../idms-backend/.local/local-settings.env
    volumes:
      - ../idms-backend/storage/objects:/data/objects
      - ../idms-backend/.local/extraction-profiles.json:/data/config/extraction-profiles.json:ro
    environment:
      # Containers reach the database as postgres:5432. Left empty, the app stops at startup
      # with "Missing required IDMS environment settings: DATABASE_URL".
      DATABASE_URL: ${IDMS_LOCAL_DATABASE_URL:-}
      IDMS_STORAGE_ROOT: /data/objects
      # The Next.js route handler reaches Uvicorn in this same container.
      IDMS_API_INTERNAL_URL: http://127.0.0.1:8000
      # ONLYOFFICE reaches the API through Next.js on the Docker network.
      ONLYOFFICE_URL: /onlyoffice
      ONLYOFFICE_API_INTERNAL_URL: http://web:9000
      ONLYOFFICE_CALLBACK_URL: http://web:9000/api/v1/integrations/onlyoffice/callback
    restart: unless-stopped
    networks: [idms]

networks:
  idms:
    external: true
    name: idms_idms
