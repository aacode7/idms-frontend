map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
# $uri, not $request: query strings carry signed storage tokens.
log_format idms '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
server {
    listen 9000;
    access_log /var/log/nginx/access.log idms;
    client_max_body_size 26m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /onlyoffice { return 302 /onlyoffice/; }
    location /onlyoffice/ {
        set $document_server http://onlyoffice;
        rewrite ^/onlyoffice/(.*)$ /$1 break;
        proxy_pass $document_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host/onlyoffice;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location / {
        set $application http://web:9000;
        proxy_pass $application;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }
}
